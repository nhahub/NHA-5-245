# Cloudflare reaches port 8080 on the Docker network.
# Only the one production webhook is public. The editor, REST API,
# webhook-test endpoints and demo controls are intentionally unreachable here.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 16k;
    resolver 127.0.0.11 ipv6=off valid=10s;

    location = /webhook/sla-guard {
        limit_except POST { deny all; }
        set $n8n_backend http://n8n:5678;
        proxy_pass $n8n_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        add_header Cache-Control "no-store" always;
    }

    location / { return 404; }
}

# Existing n8n reaches the local Supabase-compatible API on the Docker network.
server {
    listen 3000;
    server_tokens off;
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /rest/v1/ {
        set $data_backend http://data-api:3000;
        rewrite ^/rest/v1(/.*)$ $1 break;
        proxy_pass $data_backend;
    }

    location / { return 404; }
}
